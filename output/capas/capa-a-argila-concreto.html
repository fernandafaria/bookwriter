<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capa A — Argila e Concreto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Lora:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2D2A26;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
  }

  .cover {
    width: 480px; height: 680px;
    background: #C44536;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* Textura de papel artesanal */
  .cover::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(0,0,0,0.06) 0%, transparent 50%);
    opacity: 0.8;
  }

  /* Moldura interna */
  .frame {
    position: absolute; inset: 28px;
    border: 1.5px solid rgba(255,255,255,0.25);
  }

  .content {
    position: absolute; inset: 44px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .top-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px; font-weight: 500;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }

  .title-block {
    margin-top: auto; margin-bottom: auto;
  }

  .title {
    font-family: 'DM Sans', sans-serif;
    font-size: 48px; font-weight: 700;
    line-height: 1.08;
    color: #FAF7F2;
    letter-spacing: -0.02em;
  }

  .title-line { display: block; }

  .divider {
    width: 48px; height: 3px;
    background: rgba(255,255,255,0.4);
    margin: 24px 0;
  }

  .subtitle {
    font-family: 'Lora', serif;
    font-size: 15px; font-style: italic;
    line-height: 1.5;
    color: rgba(255,255,255,0.75);
    max-width: 320px;
  }

  .author {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="content">
    <div class="top-label">manual de liderança</div>
    <div class="title-block">
      <div class="title">
        <span class="title-line">Liderando</span>
        <span class="title-line">na Era dos</span>
        <span class="title-line">Agentes</span>
      </div>
      <div class="divider"></div>
      <div class="subtitle">O que fazer quando a IA muda seu time,<br>seu produto e sua carreira</div>
    </div>
    <div class="author">Fernanda Faria</div>
  </div>
</div>
</body>
</html>
